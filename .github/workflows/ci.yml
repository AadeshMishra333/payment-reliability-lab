name: Python checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t payment-reliability-lab .
      - name: Start container and check health
        run: |
          docker run --rm -d --name payment-lab-ci -p 8765:8000 payment-reliability-lab
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8765/health
      - name: Container logs on failure
        if: failure()
        run: docker logs payment-lab-ci
